version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: role_audit_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: role_audit_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d role_audit_db']
      interval: 5s
      timeout: 5s
      retries: 5

  reference-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: role_audit_express_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/role_audit_db
    ports:
      - '3000:3000'

volumes:
  pgdata:
