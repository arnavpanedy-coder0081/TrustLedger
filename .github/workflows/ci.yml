name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build, Test & Verify
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/role_audit_db

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: role_audit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript workspaces
        run: npm run build

      - name: Run unit & integration tests
        run: npm test

      - name: Run tampering attack test suite
        run: npm run tamper-test

      - name: Run performance benchmark suite
        run: npm run benchmark

      - name: Build Docker image
        if: matrix.node-version == '22.x'
        run: docker build -t trustledger-ci .

      - name: Start Docker image against CI PostgreSQL
        if: matrix.node-version == '22.x'
        run: |
          docker run -d --network host --name trustledger-reference-app \
            -e PORT=3000 \
            -e DATABASE_URL="$DATABASE_URL" \
            trustledger-ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs trustledger-reference-app
          exit 1

      - name: Collect Docker logs and stop container
        if: always() && matrix.node-version == '22.x'
        run: |
          docker logs trustledger-reference-app || true
          docker stop trustledger-reference-app || true
          docker rm trustledger-reference-app || true
